<template>

    <template if:true={hasJobs}>

        <div class="slds-m-bottom_medium">

            <h2 class="slds-text-heading_medium">
                Eligible Jobs
            </h2>

        </div>

        <div class="slds-grid slds-wrap">

            <template for:each={jobs} for:item="job">

                <div
                    key={job.Id}
                    class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_x-small"
                >

                    <c-job-card
                        job={job}
                        onapply={handleApply}>
                    </c-job-card>

                </div>

            </template>

        </div>

    </template>


    <template if:false={hasJobs}>

        <c-empty-state
            title="No eligible jobs available"
            message="There are currently no jobs matching your eligibility."
        >
        </c-empty-state>

    </template>

</template>
